# Pancreas scRNA-seq (scvi-tools / scIB reference-mapping tutorial dataset):
# ~16382 cells x ~19093 genes, obs['tech'] / obs['celltype'], raw counts in
# layers['counts']. Reference/query split matches the common reference-
# mapping example: query tech = {smartseq2, celseq2}, reference = every
# other technology. All HVG/PCA fitting (or, under batch correction, HVG
# selection + scVI/scArches model fitting) uses the reference split only.
#
# batch_correction: true (the default here) selects the batch-corrected
# analysis mode -- a scVI reference model (batch_key="tech") plus scArches
# query mapping for the held-out technologies -- in place of the legacy
# reference-only PCA. Set batch_correction: false to restore the original
# preprocessing exactly. IMPORTANT: this key did not exist before batch
# correction was added; an old run's saved config.yaml that predates it is
# treated as batch_correction: false (see src/umaping/pipeline.py::
# stage_preprocess), so previously-generated runs remain reproducible.
# scArches query mapping is NOT the same strict single-point reference-fit/
# query-transform guarantee as the legacy path -- it adapts the frozen
# reference model to the query batch unsupervised. See README.md.
dataset:
  name: pancreas
  raw_dir: data/raw/pancreas
  input_dim: 50 # must equal params.n_pcs (legacy path) or params.scvi_n_latent (batch-corrected path)
  params:
    n_hvg: 2000
    n_pcs: 50
    query_tech: [smartseq2, celseq2]
    batch_correction: true
    batch_correction_method: scvi_scarches
    scvi_n_latent: 50
    scvi_max_epochs: 400
    scarches_max_epochs: 200

umap:
  n_neighbors: 15
  embedding_dim: 2
  min_dist: 0.1
  spread: 1.0
  negative_sample_rate: 5.0
  local_connectivity: 1.0
  set_op_mix_ratio: 1.0

retriever:
  hidden_dims: [512, 256]
  retrieval_dim: 128
  activation: gelu
  temperature: 0.1
  candidate_multiplier: 4
  min_candidates: 64
  ann_backend: exact
  batch_size: 256
  n_random_negatives: 64
  exclude_known_neighbors_from_negatives: true
  lr: 0.001
  steps: 2000
  log_every: 50

spectral:
  hidden_dims: [512, 256]
  raw_output_dim: 3 # embedding_dim + 1
  activation: gelu
  orthogonality_weight: 1.0
  edge_batch_size: 4096
  lr: 0.001
  steps: 2000
  calibration_target_scale: 10.0
  log_every: 50

flow:
  n_steps: 200
  initial_alpha: 1.0
  dynamics_negative_samples: 64
  grad_clip: 4.0
  checkpoint_stride: 1

repulsion:
  hidden_dim: 256
  n_residual_blocks: 4
  time_embed_dim: 32
  activation: gelu
  jitter_sigma: 0.1
  teacher_negative_samples: 64
  weight_by_row_mass: false
  lr: 0.001
  steps: 4000
  batch_size: 512
  log_every: 100

eval:
  k: 15
  oracle_repulsion_samples: 2048
  repulsion_oracle_query_subset: 50
  trustworthiness_n_neighbors: 15

seed: 0
float_dtype: float32
