# COIL-100: 7200 RGB 128x128 images, 100 objects, 72 poses each.
# Reference/query split: every 4th pose (by rotational order) held out as
# query (~25%), rest is the fixed reference set X (~75%).
dataset:
  name: coil100
  raw_dir: data/raw/coil100
  input_dim: 256 # must equal params.pca_dim when use_pca=true, else 128*128*3
  params:
    use_pca: true
    pca_dim: 256
    holdout_period: 4

umap:
  n_neighbors: 15
  embedding_dim: 2
  min_dist: 0.1
  spread: 1.0
  negative_sample_rate: 5.0
  local_connectivity: 1.0
  set_op_mix_ratio: 1.0

retriever:
  hidden_dims: [512, 256]
  retrieval_dim: 128
  activation: gelu
  temperature: 0.1
  candidate_multiplier: 4
  min_candidates: 64
  ann_backend: exact
  batch_size: 256
  n_random_negatives: 64
  exclude_known_neighbors_from_negatives: true
  lr: 0.001
  steps: 2000
  log_every: 50

spectral:
  hidden_dims: [512, 256]
  raw_output_dim: 3 # embedding_dim + 1
  activation: gelu
  orthogonality_weight: 1.0
  edge_batch_size: 4096
  lr: 0.001
  steps: 2000
  calibration_target_scale: 10.0
  log_every: 50

flow:
  n_steps: 200
  initial_alpha: 1.0
  dynamics_negative_samples: 64
  grad_clip: 4.0
  checkpoint_stride: 1

repulsion:
  hidden_dim: 256
  n_residual_blocks: 4
  time_embed_dim: 32
  activation: gelu
  jitter_sigma: 0.1
  teacher_negative_samples: 64
  weight_by_row_mass: false
  lr: 0.001
  steps: 4000
  batch_size: 512
  log_every: 100

eval:
  k: 15
  oracle_repulsion_samples: 2048
  repulsion_oracle_query_subset: 50
  trustworthiness_n_neighbors: 15

seed: 0
float_dtype: float32
