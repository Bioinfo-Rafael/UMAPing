[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umaping"
version = "0.1.0"
description = "Inductive, single-query approximation of UMAP: learned retrieval + spectral initialization + analytic UMAP attraction + learned expected repulsion."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bioinfo-Rafael" }]
keywords = ["umap", "dimensionality-reduction", "manifold-learning", "inductive", "single-cell", "representation-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "umap-learn>=0.5.12",
    "pynndescent>=0.5.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Single-cell / AnnData stack, required for the pancreas dataset. scvi-tools
# adds the batch-corrected preprocessing path (configs/pancreas.yaml's
# batch_correction: true, the default -- scVI + its own scArches query-
# mapping implementation, scvi.model.SCVI's ArchesMixin, no separate
# `scarches` package needed); scvelo adds the total-UMAP-dynamics-field
# visualization (pancreas-only). Both are only required when those specific
# features are actually used (batch_correction: false skips scvi-tools
# entirely; scvelo is only imported inside the pancreas-only vector-field
# analysis code path).
scrna = [
    "anndata>=0.10",
    "scanpy>=1.9",
    "scvi-tools>=1.1",
    "scvelo>=0.2.5",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
all = ["umaping[scrna,dev]"]

[project.scripts]
umaping = "umaping.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/umaping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "7.0"

[tool.ruff]
line-length = 100
target-version = "py310"
