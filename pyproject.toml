[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umaping"
version = "0.1.0"
description = "Inductive, single-query approximation of UMAP: learned retrieval + spectral initialization + analytic UMAP attraction + learned expected repulsion."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bioinfo-Rafael" }]
keywords = ["umap", "dimensionality-reduction", "manifold-learning", "inductive", "single-cell", "representation-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "umap-learn>=0.5.12",
    "pynndescent>=0.5.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Single-cell / AnnData stack, only required for the pancreas dataset.
scrna = [
    "anndata>=0.10",
    "scanpy>=1.9",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
# Optional datasets used by the experiments/ suite (Fashion-MNIST, MNIST,
# Hong ED). 20 Newsgroups needs none of these (it only uses scikit-learn,
# already a core dependency).
experiments = [
    "torchvision>=0.16",
    "pyreadr>=0.5",
]
# Official external baseline implementations (experiments/baselines.py):
#   NUMAP / Sep-SpectralNet -- https://github.com/shaham-lab/NUMAP
#   ParamRepulsor           -- https://github.com/hyhuang00/ParamRepulsor
# Deliberately NOT folded into `all`: `parampacmap` (ParamRepulsor's package)
# requires Python <3.12 (its `annoy` dependency does not support 3.12+), so
# adding it to `all` would break `pip install -e ".[all]"` outright on newer
# Python versions. Install explicitly (`pip install -e ".[external-baselines]"`,
# combinable with the other extras) on Python 3.10/3.11 to get the complete
# baseline suite; on 3.12+, NUMAP alone still installs and works.
external-baselines = [
    "numap==0.2.3",
    "parampacmap==0.1.0",
]
all = ["umaping[scrna,dev,experiments]"]

[project.scripts]
umaping = "umaping.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/umaping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "7.0"

[tool.ruff]
line-length = 100
target-version = "py310"
